name: One-time import complete 2017-2026 release

on:
  push:
    paths:
      - '.github/workflows/import-complete-2017-2026.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download and verify complete release
        run: |
          curl --fail --location --retry 3 --output /tmp/site-only.tar.gz \
            'https://litter.catbox.moe/blgbxq.gz'
          echo '6b8f903a2fc2352e6e164ea09445888003f0866485bbc3d22c44b248b40ebcf9  /tmp/site-only.tar.gz' | sha256sum --check --strict

      - name: Extract complete source and site tree
        run: |
          tar -xzf /tmp/site-only.tar.gz -C .
          rm -f .github/workflows/deploy-expansion.yml

      - name: Validate imported release
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('site/data/questions.json').read_text())
          assert len(data['papers']) == 62, len(data['papers'])
          assert len(data['questions']) == 578, len(data['questions'])
          assert len(list(Path('site/questions').glob('*.webp'))) == 639
          print('validated 62 papers, 578 questions, 639 images')
          PY

      - name: Commit imported release
        run: |
          git config user.name 'MyInsightAcademy'
          git config user.email 'swati1977@users.noreply.github.com'
          git add -A
          git status --short | wc -l
          git commit -m '[verified] deploy complete IB Maths 2017-2026 question bank'

      - name: Push imported release
        run: git push origin main
