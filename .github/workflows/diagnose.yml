name: Complete verified import

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore and commit verified tree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, re
          text = Path('.github/workflows/pages.yml').read_text()
          encoded = re.search(r"printf '%s' '([^']+)'", text).group(1)
          Path('/tmp/verified-site.tar.xz').write_bytes(base64.b64decode(encoded))
          PY
          tar -xJf /tmp/verified-site.tar.xz
          rm -f .github/workflows/diagnose.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '[verified] build IB Maths AA topic finder'
          if ! git push origin HEAD:main 2>/tmp/push-error; then
            message=$(tr '\n' ' ' </tmp/push-error)
            echo "::error::$message"
            exit 1
          fi
