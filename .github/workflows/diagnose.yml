name: Complete verified import

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore non-workflow files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, re
          text = Path('.github/workflows/pages.yml').read_text()
          encoded = re.search(r"printf '%s' '([^']+)'", text).group(1)
          Path('/tmp/verified-site.tar.xz').write_bytes(base64.b64decode(encoded))
          PY
          cp .github/workflows/pages.yml /tmp/bootstrap-pages.yml
          tar -xJf /tmp/verified-site.tar.xz
          cp /tmp/bootstrap-pages.yml .github/workflows/pages.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitignore README.md data scripts site
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m '[verified] build IB Maths AA topic finder'
          git push origin HEAD:main
