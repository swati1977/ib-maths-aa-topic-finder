name: Bootstrap verified site

on:
  push:
    branches: [main]
    paths: ['.github/workflows/bootstrap.yml']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified source archive
        run: |
          curl --fail --location --retry 3 'https://tmpfiles.org/dl/1787157021.b184bb78e2462e36/wWwvrvfLJCmb/site-bootstrap.tar.xz' -o /tmp/site-bootstrap.tar.xz
          echo '0ee941dd0b397cf948c11895ba4ceb5feedbbdce8e22b6d39090c578e98b63d4  /tmp/site-bootstrap.tar.xz' | sha256sum --check
          tar --exclude='.github/workflows/pages.yml' -xJf /tmp/site-bootstrap.tar.xz
      - name: Attempt to commit public source files
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md site
          git commit -m '[verified] publish IB Maths AA topic finder'
          git push
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
