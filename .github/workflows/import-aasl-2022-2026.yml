name: Import verified AA SL 2022-2026 release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-aasl-2022-2026.yml']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  import-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified release archive
        run: |
          curl --fail --location --retry 3 'https://tmpfiles.org/dl/1787229042.8b99abd578185e50/wgwlrY5dzWOA/aasl-2022-2026-release.tar.xz' -o /tmp/aasl-release.tar.xz
          echo '1fef13adb06369ba5e56c4f535d19055276e7f1b87438bc67e500996d2103b2b  /tmp/aasl-release.tar.xz' | sha256sum --check
          tar -xJf /tmp/aasl-release.tar.xz
      - name: Commit verified release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md data scripts site tests
          git commit -m '[verified] expand AA SL question bank to 2022-2026'
          git push
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
