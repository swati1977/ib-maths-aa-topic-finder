name: Import verified static site

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified repository tree
        run: |
          printf '%s' '' | base64 --decode > /tmp/verified-site.tar.xz
          tar -xJf /tmp/verified-site.tar.xz
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '[verified] build IB Maths AA topic finder'
          git push origin HEAD:main
