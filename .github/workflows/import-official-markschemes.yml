name: One-time import official markscheme release

on:
  push:
    paths:
      - '.github/workflows/import-official-markschemes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download verified archive parts
        run: |
          curl --fail --location --retry 3 --output /tmp/part-aa.gz 'https://tmpfiles.org/dl/1787308083.d7cc0be12bbf1ea2/w8wMrQRYmYDr/ib-ms-part-aa.gz'
          curl --fail --location --retry 3 --output /tmp/part-ab.gz 'https://tmpfiles.org/dl/1787308156.c8816cfaef9827ae/wIwQrdRCPerX/ib-ms-part-ab.gz'
          echo '83702d89e71a1cd4e9ec2b267874116a0673665bb02a84a074c05bf0795ff516  /tmp/part-aa.gz' | sha256sum --check
          echo 'aec8b1bdb1cf9a5a71a6e7548929333c3d12c3a4f21b659fd9fe2f5242278263  /tmp/part-ab.gz' | sha256sum --check
          cat /tmp/part-aa.gz /tmp/part-ab.gz > /tmp/release.tar.gz
          echo '32c5042f4cff1dd80e45ade265150977984b3194b7586c84d2571fba1eee0fb3  /tmp/release.tar.gz' | sha256sum --check
      - name: Extract exact reviewed tree
        run: |
          cp .github/workflows/pages.yml /tmp/pages.yml
          tar -xzf /tmp/release.tar.gz
          cp /tmp/pages.yml .github/workflows/pages.yml
      - name: Validate release contents
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.load(open('site/data/questions.json'))
          manifest=json.load(open('data/official-markscheme-images.json'))
          assert len(data['papers']) == 62
          assert len(data['questions']) == 578
          assert len(manifest) == 542
          assert sum(len(v['images']) for v in manifest.values()) == 824
          assert len(list(Path('site/markschemes').glob('*.webp'))) == 824
          assert not any(Path('.').glob('data/raw/**/*.pdf'))
          assert not any(Path('.').glob('data/extracted/**/*'))
          print('validated 62 papers / 578 questions / 542 official answers / 824 crops')
          PY
      - name: Commit and push exact release
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'publish official markscheme crops and image-first practice UI'
          git push origin HEAD:main
